syntax = "proto3";

package sisyphus.node.v1;

option go_package = "github.com/sisyphus-network/Sisyphus/packages/protocol/sisyphus/node/v1;nodev1";

service NodeService {
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);
  // Location discovery is opt-in. Changes are saved by the node and take
  // effect after it restarts, whether the desktop starts it or not.
  rpc GetLocationDiscoverySettings(GetLocationDiscoverySettingsRequest) returns (LocationDiscoverySettingsState);
  rpc SetLocationDiscoverySettings(SetLocationDiscoverySettingsRequest) returns (LocationDiscoverySettingsState);
  // The limits a coordinator holds each member to. Changes are saved by the
  // node and take effect after it restarts, whether the desktop starts it
  // or not; a node that does not run the coordinator role holds no one to
  // them.
  rpc GetPoolLimits(GetPoolLimitsRequest) returns (PoolLimitsState);
  rpc SetPoolLimits(SetPoolLimitsRequest) returns (PoolLimitsState);
  // Browser access is disabled until explicitly enabled by the node owner.
  rpc GetWebAccessConfig(GetWebAccessConfigRequest) returns (WebAccessConfig);
  rpc SetWebAccessConfig(SetWebAccessConfigRequest) returns (WebAccessConfig);
  // ListNetworkInterfaces lists usable, non-loopback IP addresses assigned
  // to interfaces on this node, for configuring its optional web listener.
  rpc ListNetworkInterfaces(ListNetworkInterfacesRequest) returns (ListNetworkInterfacesResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc WatchPeers(WatchPeersRequest) returns (stream ListPeersResponse);
  rpc GetBootstrapPeers(GetBootstrapPeersRequest) returns (GetBootstrapPeersResponse);
  rpc SetBootstrapPeers(SetBootstrapPeersRequest) returns (SetBootstrapPeersResponse);
  rpc ConnectPeer(ConnectPeerRequest) returns (ConnectPeerResponse);
  // SetPeerComputeTrust sets both sides of trust in a peer at once: whether
  // this node gives it work and whether this node takes work from it.
  rpc SetPeerComputeTrust(SetPeerComputeTrustRequest) returns (SetPeerComputeTrustResponse);
  // SetPeerComputePermissions sets the two sides separately.
  rpc SetPeerComputePermissions(SetPeerComputePermissionsRequest) returns (SetPeerComputePermissionsResponse);

  // The rest is the work of the pool this node coordinates. A node that
  // coordinates none answers them with FAILED_PRECONDITION.

  // ListWorkers lists the nodes connected to this one as its workers.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  // SubmitJob gives the pool a job and returns it as it stands at once.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  // ListJobs lists the jobs this node has on record, newest first.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // WatchJobs sends that list at once and again, in full, whenever any job
  // changes, with a revision that counts up from one.
  rpc WatchJobs(WatchJobsRequest) returns (stream ListJobsResponse);
  // CancelJob stops a job that has not finished.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // WatchJobEvents sends what has happened to a job, from the event after
  // the one named, and goes on as more happens until the job has finished:
  // the steps of its life and the lines its tasks log.
  rpc WatchJobEvents(WatchJobEventsRequest) returns (stream JobEvent);

  // The rest is the planner: a language model that is asked a question,
  // has the pool compute what the answer needs, and answers.

  // GetModelConfig says which model the node plans with. It never returns
  // the service's key, only whether one is set.
  rpc GetModelConfig(GetModelConfigRequest) returns (ModelConfig);
  rpc SetModelConfig(SetModelConfigRequest) returns (ModelConfig);
  rpc ListModelProfiles(ListModelProfilesRequest) returns (ListModelProfilesResponse);
  rpc SaveModelProfile(SaveModelProfileRequest) returns (ModelProfile);
  rpc DeleteModelProfile(DeleteModelProfileRequest) returns (DeleteModelProfileResponse);
  // GetModelLending says how this machine lends its Ollama models to the
  // pool: as saved, and as the node runs now. SetModelLending applies model
  // allowlists and request limits live when lending stays enabled at the
  // same address; enabling, disabling or changing that address takes effect
  // on restart. InspectOllama asks an Ollama what it is and which of its
  // models would be lent.
  rpc GetModelLending(GetModelLendingRequest) returns (ModelLendingState);
  rpc SetModelLending(SetModelLendingRequest) returns (ModelLendingState);
  rpc InspectOllama(InspectOllamaRequest) returns (InspectOllamaResponse);
  // ListProviders lists the kinds of model service there are to choose
  // from, the one that needs no account first.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // ListModels asks a service which models it offers: the configured one,
  // or one the request describes, so that a service's models can be shown
  // before it is chosen. Describing one needs the node's token.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // PullModel fetches a model to the machine its service runs on, for a
  // provider whose models are fetched before use, and says how far it has
  // got as it goes. It ends when the model is there. Needs the token.
  rpc PullModel(PullModelRequest) returns (stream PullModelProgress);
  // RemoveModel deletes a fetched model from that machine. Needs the token.
  rpc RemoveModel(RemoveModelRequest) returns (RemoveModelResponse);
  // Ask puts a question to the planner, in a new conversation or an
  // existing one, and sends what it does as it does it: what the model
  // says, each job it runs, and at the end the event "done".
  rpc Ask(AskRequest) returns (stream AskEvent);
  // ListChats lists the conversations on record, newest first.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc GetChat(GetChatRequest) returns (GetChatResponse);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);

  // The rest is the pool's files and who belongs to it, on a node that
  // coordinates a pool.

  // StoreFile puts a file in the pool's store and keeps it there until it
  // is removed. The first message names it; every message may carry data.
  // The answer has its CID, which is what a job is given as its input.
  rpc StoreFile(stream StoreFileRequest) returns (File);
  // FetchFile sends what is stored under a CID: a file stored here, or
  // something a job produced.
  rpc FetchFile(FetchFileRequest) returns (stream FetchFileResponse);
  // ListFiles lists the files stored through StoreFile, newest first.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // RemoveFile stops keeping a file. Its content goes when the store is
  // next cleared of what nothing holds.
  rpc RemoveFile(RemoveFileRequest) returns (RemoveFileResponse);

  // CreateInvitation makes an invitation for another machine to join the
  // pool with: as a worker, or as a client that may only submit jobs. It
  // works once.
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  // ListMembers lists the nodes admitted to the pool.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // RemoveMember takes a node out of the pool and disconnects it.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // JoinPool has this node join another node's pool with an invitation
  // from it, and start working for it, beside whatever else it is doing.
  // It is what a node started with --join does, without the restart.
  rpc JoinPool(JoinPoolRequest) returns (JoinPoolResponse);
}

message GetNodeInfoRequest {}

message GetNodeInfoResponse {
  string peer_id = 1;
  string daemon_version = 2;
  repeated string listen_addresses = 3;
  string country_code = 4;
  // The names of the workloads this node can run or coordinate.
  repeated string workloads = 5;
  // Explicit API capabilities. Missing entries mean unsupported, including
  // when talking to an older daemon that ignores newer request fields.
  repeated string capabilities = 6;
  // How country_code was found: "interface" from an address the node has
  // itself, "pool" from its address as the pool sees it, "gateway" from the
  // external address its gateway gave when asked by NAT-PMP, "stun" from
  // the address a STUN server the user named saw its traffic come from,
  // "lookup" from the outside service it was allowed to ask, or empty if it
  // is not known. A
  // country found by the pool is where the node's traffic comes from, as
  // the pool sees it, which behind a VPN is not where the machine is.
  string country_source = 7;
}

message GetWebAccessConfigRequest {}

message WebAccessConfig {
  bool enabled = 1;
  // A specific IP:port assigned to this node; wildcard listeners are not
  // accepted. An enabled listener always uses HTTPS and browser pairing.
  string listen_address = 2;
  string certificate_fingerprint = 3;
  bool restart_required = 4;
  string public_url = 5;
  // Every selected interface address listens on the same port. The singular
  // listen_address remains the first entry for older desktop clients.
  repeated string listen_addresses = 6;
}

message SetWebAccessConfigRequest {
  bool enabled = 1;
  string listen_address = 2;
  string public_url = 3;
  repeated string listen_addresses = 4;
}

message ListNetworkInterfacesRequest {}

message ListNetworkInterfacesResponse {
  repeated NetworkInterface interfaces = 1;
}

message NetworkInterface {
  string name = 1;
  string address = 2;
}

message ListPeersRequest {}

message WatchPeersRequest {}

message GetBootstrapPeersRequest {}

message GetBootstrapPeersResponse {
  repeated BootstrapPeer peers = 1;
}

message SetBootstrapPeersRequest {
  repeated BootstrapPeer peers = 1;
}

message SetBootstrapPeersResponse {
  repeated BootstrapPeer peers = 1;
}

message ConnectPeerRequest { string address = 1; }
message ConnectPeerResponse { string peer_id = 1; }
message SetPeerComputeTrustRequest {
  string peer_id = 1;
  bool trusted = 2;
}
message SetPeerComputeTrustResponse { bool trusted = 1; }

message SetPeerComputePermissionsRequest {
  string peer_id = 1;
  // This node gives the peer work: the peer may work for this node.
  bool gives_work = 2;
  // This node takes work from the peer: it will work for the peer.
  bool takes_work = 3;
}
message SetPeerComputePermissionsResponse {
  bool gives_work = 1;
  bool takes_work = 2;
}

message BootstrapPeer {
  string peer_id = 1;
  string address = 2;
}

message ListPeersResponse {
  repeated Peer peers = 1;
  uint64 revision = 2;
}

message Peer {
  string peer_id = 1;
  PeerConnectionState connection_state = 2;
  repeated string known_addresses = 3;
  bool trusted_for_compute = 4;
  // Trust has two sides, and work flows only when both hold. These say
  // which way it is flowing now: the peer is connected as a worker of this
  // node, and this node is working for the peer.
  bool works_for_this_node = 5;
  bool this_node_works_for = 6;
  // The two sides of this node's trust in the peer: that it gives the peer
  // work, and that it takes work from the peer. trusted_for_compute is set
  // if either is.
  bool gives_work = 7;
  bool takes_work = 8;
  // The two-letter code of the country the node's address is registered
  // in, from a table the daemon carries; empty if none of its addresses
  // has a place in the world, as on a home network.
  string country_code = 9;
}

enum PeerConnectionState {
  PEER_CONNECTION_STATE_UNSPECIFIED = 0;
  PEER_CONNECTION_STATE_DISCONNECTED = 1;
  PEER_CONNECTION_STATE_CONNECTED = 2;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated Worker workers = 1;
}

message Worker {
  string peer_id = 1;
  // The label the node gave itself.
  string name = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  uint32 cpu_cores = 6;
  // How many tasks it runs at once, and how many it is running now.
  uint32 task_slots = 7;
  uint32 running_tasks = 8;
  repeated string workloads = 9;
  // Whether it relays between the pool's other members, and what it says it
  // has carried for them since it started.
  bool relays = 10;
  uint64 relayed_connections = 11;
  uint64 relayed_bytes = 12;
  // What the machine has, as far as it could tell and its owner offers:
  // zero and empty where unknown.
  string cpu_model = 13;
  uint64 memory_bytes = 14;
  repeated WorkerGpu gpus = 15;
  // The language models the worker serves to the pool, by name.
  repeated string models = 16;
  // Those of them its model server had in memory when it last said, and
  // how much of each is on a graphics card. A model not listed here is
  // loaded when first asked for, which takes a while.
  repeated LoadedModel loaded_models = 20;
  // Its standing, which outlasts any one job: how many results it has
  // returned for verified tasks that were among those the task was settled
  // by, and how many that were not. probation is how many agreeing results
  // it still owes, having been outvoted, before a job that verifies a
  // share of its tasks takes its word alone again; zero for a worker that
  // is not on probation.
  uint64 verified_agreed = 17;
  uint64 verified_outvoted = 18;
  uint32 probation = 19;
}

message WorkerGpu {
  string name = 1;
  uint64 memory_bytes = 2;
}

message LoadedModel {
  string name = 1;
  // From 0 to 100. The rest is in the machine's memory and worked by its
  // processor, and replies come that much slower.
  uint32 on_card_percent = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}

enum JobMode {
  JOB_MODE_UNSPECIFIED = 0;
  // Split into tasks spread across workers.
  JOB_MODE_DISTRIBUTED = 1;
  // Sent whole to one worker.
  JOB_MODE_FULL_WORKER = 2;
}

message Job {
  string job_id = 1;
  string workload = 2;
  // Workload-defined parameters and result. The built-in workloads use JSON.
  bytes params = 3;
  JobMode mode = 4;
  JobState state = 5;
  repeated JobTask tasks = 6;
  bytes result = 7;
  string error = 8;
  // Milliseconds since the Unix epoch; zero for a job not yet finished.
  int64 created_at_ms = 9;
  int64 finished_at_ms = 10;
  // CIDs of the stored data the job consumed and of what its result is.
  repeated string input_blobs = 11;
  repeated string output_blobs = 12;
  // From 0 to 1: the mean of its tasks' progress.
  double progress = 13;
  // If not zero, how long any one attempt at a task may run.
  uint32 task_timeout_seconds = 14;
  uint64 min_memory_bytes = 15;
  uint32 min_gpus = 16;
  bool private = 17;
  // Set on a job that is a step of another, a graph: the job it is a step
  // of, and the step's name. A graph's own tasks are its steps, in order.
  string parent_job_id = 18;
  string step = 19;
  // Set once the job is over: the CID of its record, which names the
  // job's whole history. Empty until then.
  string record_cid = 20;
  // How many different workers must return the same result for each task;
  // see SubmitJobRequest. Zero or one for a job that is not verified.
  uint32 verify = 21;
  // The share of its tasks that are verified, if not all of them; see
  // SubmitJobRequest.
  double verify_share = 22;
  // The share of its tasks the coordinator runs again itself; see
  // SubmitJobRequest.
  double audit_share = 23;
}

message JobTask {
  uint32 index = 1;
  JobState state = 2;
  // How many times it has been handed to a worker.
  uint32 attempt = 3;
  // The worker running it, or that last did.
  string peer_id = 4;
  string worker_name = 5;
  // Why its last failed attempt failed, if one did.
  string error = 6;
  // From 0 to 1, as far as the task itself says.
  double progress = 7;
  // In a job that is verified, how many different workers must return the
  // same result for this task: one for a task its spot checks passed over.
  uint32 verify = 8;
}

message SubmitJobRequest {
  string workload = 1;
  bytes params = 2;
  JobMode mode = 3;
  // Distributed mode only: how many tasks to split into. Zero means one for
  // each worker slot connected now.
  uint32 max_tasks = 4;
  // If not zero, stop and retry any attempt at a task that runs longer.
  uint32 task_timeout_seconds = 5;
  // Give its tasks only to workers with at least this much memory and this
  // many graphics cards. Zero asks nothing.
  uint64 min_memory_bytes = 6;
  uint32 min_gpus = 7;
  // Make the job private: everything it stores is sealed with this node's
  // key, and inputs stored as private files are opened with it. The pool's
  // other members hold only what they cannot read; the workers that run
  // the job's tasks are given the key.
  bool private = 8;
  // Verify the job's results by replication: two or more has each task run
  // by that many different workers, and the task succeeds only once that
  // many have returned the same result. Zero or one runs each task once.
  // Only for work that gives the same result every time, and not for a
  // private job. It is refused if fewer workers that could take the job
  // are connected.
  uint32 verify = 9;
  // Spot checks: with verify, a share between 0 and 1 has only that share
  // of the tasks verified, chosen at random and rounded up to a whole task,
  // and the rest run once. A worker whose result for a verified task loses
  // to the one the others agree on has the tasks it ran unverified in the
  // job verified after all. Zero, and one, verify every task.
  double verify_share = 10;
  // A share between 0 and 1 of the job's tasks, picked by chance as their
  // results come in, that the coordinating node runs again itself before
  // taking the result. Where the two differ its own is taken. Refused for
  // a workload that node cannot run itself.
  double audit_share = 11;
}

message SubmitJobResponse { Job job = 1; }

message CancelJobRequest { string job_id = 1; }

message CancelJobResponse { Job job = 1; }

message WatchJobEventsRequest {
  string job_id = 1;
  // Send only events numbered after this one. Zero sends them all.
  uint64 after_seq = 2;
}

message JobEvent {
  // Events of a job are numbered from one, in the order they happened.
  uint64 seq = 1;
  // Milliseconds since the Unix epoch.
  int64 at_ms = 2;
  // What happened: submitted, task-started, task-succeeded, task-failed,
  // task-lost, task-timed-out, log, succeeded, failed, cancelled, resumed.
  // In a job that is verified, also task-result, for each result a worker
  // returns, task-disagreed, when the results in for a task differ, and
  // task-rechecked, when a task that spot checks had passed over is to be
  // verified after all.
  string kind = 3;
  // The task concerned, or -1 if the event is about the job as a whole.
  int32 task_index = 4;
  string worker_name = 5;
  string text = 6;
}

message GetJobRequest { string job_id = 1; }

message GetJobResponse { Job job = 1; }

message ListJobsRequest {}

message WatchJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
  uint64 revision = 2;
}

message GetModelConfigRequest {}

message ModelConfig {
  // One of the providers ListProviders lists.
  string provider = 1;
  // Where the service is, if not in that provider's usual place.
  string base_url = 2;
  string model = 3;
  bool has_api_key = 4;
}

message SetModelConfigRequest {
  string provider = 1;
  string base_url = 2;
  string model = 3;
  // The service's key, if it wants one. Leave empty and set keep_api_key to
  // change the model without sending the key again. The key is kept only
  // for the provider and address it was saved with: change either and the
  // configuration is saved without a key, as has_api_key in the answer says.
  string api_key = 4;
  bool keep_api_key = 5;
}

message ModelProfile {
  string id = 1;
  string name = 2;
  string provider = 3;
  string base_url = 4;
  string model = 5;
  bool has_api_key = 6;
  bool active = 7;
}
message ListModelProfilesRequest {}
message ListModelProfilesResponse { repeated ModelProfile profiles = 1; }
message SaveModelProfileRequest {
  string id = 1;
  string name = 2;
  string provider = 3;
  string base_url = 4;
  string model = 5;
  string api_key = 6;
  bool keep_api_key = 7;
  bool active = 8;
}
message DeleteModelProfileRequest { string id = 1; }
message DeleteModelProfileResponse {}

// How a worker's owner lends the models of an Ollama on their machine.
message ModelLending {
  bool enabled = 1;
  // Such as http://127.0.0.1:11434.
  string ollama_url = 2;
  // The models offered: a model as Ollama names it (qwen3:8b), a family
  // (llama3.1) or a pattern (gemma*). None offers them all.
  repeated string only = 3;
  // How many of a model's layers may go on graphics cards: 0 for none, -1
  // for as many as fit.
  int32 gpu_layers = 4;
  // The processor's threads a model may use; 0 lets Ollama decide.
  int32 threads = 5;
  // The tokens of a conversation a model holds; 0 lets Ollama decide.
  int32 context = 6;
  // How long a model stays loaded after it answered, such as "10m", or "0"
  // to unload it at once; empty lets Ollama decide.
  string keep_alive = 7;
}

message ModelLendingState {
  // What is saved.
  ModelLending saved = 1;
  // What the node runs with now.
  ModelLending running = 2;
  // The node was started with --models-from, which decides in place of
  // what is saved.
  bool set_by_flags = 3;
  // A change to lending state or address is saved but waits for restart.
  bool restart_needed = 4;
}

message GetModelLendingRequest {}
message SetModelLendingRequest { ModelLending lending = 1; }

message InspectOllamaRequest {
  string url = 1;
  // Which of its models would be lent; none for all.
  repeated string only = 2;
}

message InspectOllamaResponse {
  // Empty if it could not be reached or is not an Ollama; error says why.
  string version = 1;
  string error = 2;
  repeated string models = 3;
  repeated LoadedModel loaded = 4;
}

message ListProvidersRequest {}

message ListProvidersResponse { repeated Provider providers = 1; }

// Provider is a kind of model service.
message Provider {
  // What a ModelConfig names it by.
  string id = 1;
  // What people call it, and a line on what it is for.
  string name = 2;
  string about = 3;
  // Where the service is if base_url is left empty.
  string default_url = 4;
  // Whether it wants a key: no, yes, or unknown for a provider that is
  // many services, some of which do.
  Support needs_key = 5;
  // Whether its models are fetched before use, with PullModel.
  bool fetches_models = 6;
}

// Support is whether something is so, as far as is known.
enum Support {
  SUPPORT_UNKNOWN = 0;
  SUPPORT_YES = 1;
  SUPPORT_NO = 2;
}

// ModelService says which service a request about models is for. Empty, it
// is the configured one.
message ModelService {
  string provider = 1;
  string base_url = 2;
  // The service's key, if it wants one. keep_api_key uses the saved key
  // instead, and only for the provider and address it was saved with: the
  // saved key is never sent anywhere else.
  string api_key = 3;
  bool keep_api_key = 4;
}

message ListModelsRequest { ModelService service = 1; }

message ListModelsResponse {
  // The models' names, and the same models with what is known of each.
  repeated string models = 1;
  repeated Model details = 2;
}

message Model {
  string name = 1;
  // What the service calls it for people to read, if anything.
  string label = 2;
  // How much room it takes on the machine serving it, if the service says.
  uint64 size_bytes = 3;
  // Whether it can ask for tools to be run. A planner's model must: one
  // that cannot will answer without computing anything.
  Support tools = 4;
}

message PullModelRequest {
  ModelService service = 1;
  string model = 2;
}

message PullModelProgress {
  // What is being done, in the service's words.
  string status = 1;
  // Bytes of the part being fetched; both zero for a step not measured.
  uint64 completed_bytes = 2;
  uint64 total_bytes = 3;
}

message RemoveModelRequest {
  ModelService service = 1;
  string model = 2;
}

message RemoveModelResponse {}

message AskRequest {
  // The conversation to continue, or empty to start one.
  string chat_id = 1;
  string text = 2;
  // Files uploaded by the owner and retained by this conversation. These
  // are explicit references, not parsed from model/user message text.
  // Omit on later turns when the conversation already retains them.
  repeated string attachment_cids = 3;
}

message AskEvent {
  // The conversation this belongs to. Set on every event, so that the first
  // one tells a caller that started a conversation what it is called.
  string chat_id = 1;
  // "text": a piece of what the model is saying, in text.
  // "call": the model asked for a tool; tool names it, text is its arguments.
  // "job": the planner gave the pool a job; job_id names it.
  // "result": what a tool returned, in text.
  // "done": the answer is complete. Always the last event.
  string kind = 2;
  string text = 3;
  string job_id = 4;
  string tool = 5;
}

message ListChatsRequest {}

message ListChatsResponse { repeated ChatSummary chats = 1; }

message ChatSummary {
  string chat_id = 1;
  // The start of its first question.
  string title = 2;
  int64 created_at_ms = 3;
}

message GetChatRequest { string chat_id = 1; }

message GetChatResponse { repeated ChatMessage messages = 1; }

message ChatMessage {
  // "user", "assistant", or "tool" for what a tool returned.
  string role = 1;
  string content = 2;
  // On an assistant's message: the tools it asked for.
  repeated ChatToolCall calls = 3;
  // On a tool's message: which tool.
  string tool = 4;
}

message ChatToolCall {
  string name = 1;
  // A JSON object.
  string arguments = 2;
}

message DeleteChatRequest { string chat_id = 1; }

message DeleteChatResponse {}

message StoreFileRequest {
  // What to call the file, in the first message.
  string name = 1;
  bytes data = 2;
  // In the first message: seal the file with this node's key before it is
  // stored, so that the rest of the pool holds only what it cannot read.
  // Give it to jobs submitted as private.
  bool private = 3;
  // In the first message: a chat attachment, held temporarily until Ask
  // retains it for a conversation. Must also be private. Normal uploads
  // remain explicitly user-owned until RemoveFile.
  bool chat_attachment = 4;
}

message File {
  string cid = 1;
  string name = 2;
  uint64 size_bytes = 3;
  int64 stored_at_ms = 4;
  bool private = 5;
}

message FetchFileRequest { string cid = 1; }

message FetchFileResponse { bytes data = 1; }

message ListFilesRequest {}

message ListFilesResponse { repeated File files = 1; }

message RemoveFileRequest { string cid = 1; }

message RemoveFileResponse {}

enum PoolRole {
  POOL_ROLE_UNSPECIFIED = 0;
  // Runs tasks for the pool.
  POOL_ROLE_WORKER = 1;
  // Submits jobs to the pool and reads their results.
  POOL_ROLE_CLIENT = 2;
}

message CreateInvitationRequest {
  PoolRole role = 1;
  // How long the invitation can be used for. Zero means one hour.
  uint64 ttl_seconds = 2;
}

message CreateInvitationResponse {
  // What the joining machine is started with, as its --invitation.
  string invitation = 1;
  int64 expires_at_ms = 2;
}

message ListMembersRequest {}

message ListMembersResponse { repeated PoolMember members = 1; }

message PoolMember {
  string peer_id = 1;
  PoolRole role = 2;
  int64 joined_at_ms = 3;
}

message RemoveMemberRequest { string peer_id = 1; }

message RemoveMemberResponse {}

message JoinPoolRequest {
  // Where the other node listens, as host:port.
  string address = 1;
  // What its owner made with CreateInvitation or `pool invite`.
  string invitation = 2;
}

message JoinPoolResponse {
  // The node whose pool was joined.
  string peer_id = 1;
  PoolRole role = 2;
}

message LocationDiscoverySettings {
  bool locate_gateway = 1;
  bool locate_country = 2;
  string stun_server = 3;
}

message LocationDiscoverySettingsState {
  LocationDiscoverySettings saved = 1;
  LocationDiscoverySettings running = 2;
  bool gateway_supported = 3;
  bool restart_needed = 4;
  bool configured = 5;
}

message GetLocationDiscoverySettingsRequest {}
message SetLocationDiscoverySettingsRequest { LocationDiscoverySettings settings = 1; }

// PoolLimits are what a coordinator lets one member use. 0 means no limit
// in each field. The node's own jobs are not held to the per-client ones.
message PoolLimits {
  // How many unfinished jobs one client may have at once.
  uint32 max_jobs_per_client = 1;
  // How many unfinished tasks, waiting or running, one client may have
  // across its jobs.
  uint32 max_tasks_per_client = 2;
  // The longest one attempt at a task of a client's job may run, in
  // seconds.
  uint64 max_task_timeout_seconds = 3;
  // The most one client may keep in the coordinator's store, in bytes.
  uint64 max_store_bytes_per_client = 4;
  // The most a worker may upload for one attempt at a task, in bytes.
  uint64 max_upload_bytes_per_attempt = 5;
}

message PoolLimitsState {
  PoolLimits saved = 1;
  PoolLimits running = 2;
  bool restart_needed = 3;
  bool configured = 4;
  // Whether this node runs the coordinator role; without it the limits
  // hold no one to anything.
  bool coordinator = 5;
}

message GetPoolLimitsRequest {}
message SetPoolLimitsRequest { PoolLimits limits = 1; }
