syntax = "proto3";

package sisyphus.node.v1;

option go_package = "github.com/sisyphus-network/Sisyphus/packages/protocol/sisyphus/node/v1;nodev1";

service NodeService {
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc WatchPeers(WatchPeersRequest) returns (stream ListPeersResponse);
  rpc GetBootstrapPeers(GetBootstrapPeersRequest) returns (GetBootstrapPeersResponse);
  rpc SetBootstrapPeers(SetBootstrapPeersRequest) returns (SetBootstrapPeersResponse);
  rpc ConnectPeer(ConnectPeerRequest) returns (ConnectPeerResponse);
  // SetPeerComputeTrust sets both sides of trust in a peer at once: whether
  // this node gives it work and whether this node takes work from it.
  rpc SetPeerComputeTrust(SetPeerComputeTrustRequest) returns (SetPeerComputeTrustResponse);
  // SetPeerComputePermissions sets the two sides separately.
  rpc SetPeerComputePermissions(SetPeerComputePermissionsRequest) returns (SetPeerComputePermissionsResponse);

  // The rest is the work of the pool this node coordinates. A node that
  // coordinates none answers them with FAILED_PRECONDITION.

  // ListWorkers lists the nodes connected to this one as its workers.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  // SubmitJob gives the pool a job and returns it as it stands at once.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  // ListJobs lists the jobs this node has on record, newest first.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // WatchJobs sends that list at once and again, in full, whenever any job
  // changes, with a revision that counts up from one.
  rpc WatchJobs(WatchJobsRequest) returns (stream ListJobsResponse);
  // CancelJob stops a job that has not finished.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // WatchJobEvents sends what has happened to a job, from the event after
  // the one named, and goes on as more happens until the job has finished:
  // the steps of its life and the lines its tasks log.
  rpc WatchJobEvents(WatchJobEventsRequest) returns (stream JobEvent);
}

message GetNodeInfoRequest {}

message GetNodeInfoResponse {
  string peer_id = 1;
  string daemon_version = 2;
  repeated string listen_addresses = 3;
  string country_code = 4;
  // The names of the workloads this node can run or coordinate.
  repeated string workloads = 5;
}

message ListPeersRequest {}

message WatchPeersRequest {}

message GetBootstrapPeersRequest {}

message GetBootstrapPeersResponse {
  repeated BootstrapPeer peers = 1;
}

message SetBootstrapPeersRequest {
  repeated BootstrapPeer peers = 1;
}

message SetBootstrapPeersResponse {
  repeated BootstrapPeer peers = 1;
}

message ConnectPeerRequest { string address = 1; }
message ConnectPeerResponse { string peer_id = 1; }
message SetPeerComputeTrustRequest {
  string peer_id = 1;
  bool trusted = 2;
}
message SetPeerComputeTrustResponse { bool trusted = 1; }

message SetPeerComputePermissionsRequest {
  string peer_id = 1;
  // This node gives the peer work: the peer may work for this node.
  bool gives_work = 2;
  // This node takes work from the peer: it will work for the peer.
  bool takes_work = 3;
}
message SetPeerComputePermissionsResponse {
  bool gives_work = 1;
  bool takes_work = 2;
}

message BootstrapPeer {
  string peer_id = 1;
  string address = 2;
}

message ListPeersResponse {
  repeated Peer peers = 1;
  uint64 revision = 2;
}

message Peer {
  string peer_id = 1;
  PeerConnectionState connection_state = 2;
  repeated string known_addresses = 3;
  bool trusted_for_compute = 4;
  // Trust has two sides, and work flows only when both hold. These say
  // which way it is flowing now: the peer is connected as a worker of this
  // node, and this node is working for the peer.
  bool works_for_this_node = 5;
  bool this_node_works_for = 6;
  // The two sides of this node's trust in the peer: that it gives the peer
  // work, and that it takes work from the peer. trusted_for_compute is set
  // if either is.
  bool gives_work = 7;
  bool takes_work = 8;
}

enum PeerConnectionState {
  PEER_CONNECTION_STATE_UNSPECIFIED = 0;
  PEER_CONNECTION_STATE_DISCONNECTED = 1;
  PEER_CONNECTION_STATE_CONNECTED = 2;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated Worker workers = 1;
}

message Worker {
  string peer_id = 1;
  // The label the node gave itself.
  string name = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  uint32 cpu_cores = 6;
  // How many tasks it runs at once, and how many it is running now.
  uint32 task_slots = 7;
  uint32 running_tasks = 8;
  repeated string workloads = 9;
  // Whether it relays between the pool's other members, and what it says it
  // has carried for them since it started.
  bool relays = 10;
  uint64 relayed_connections = 11;
  uint64 relayed_bytes = 12;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}

enum JobMode {
  JOB_MODE_UNSPECIFIED = 0;
  // Split into tasks spread across workers.
  JOB_MODE_DISTRIBUTED = 1;
  // Sent whole to one worker.
  JOB_MODE_FULL_WORKER = 2;
}

message Job {
  string job_id = 1;
  string workload = 2;
  // Workload-defined parameters and result. The built-in workloads use JSON.
  bytes params = 3;
  JobMode mode = 4;
  JobState state = 5;
  repeated JobTask tasks = 6;
  bytes result = 7;
  string error = 8;
  // Milliseconds since the Unix epoch; zero for a job not yet finished.
  int64 created_at_ms = 9;
  int64 finished_at_ms = 10;
  // CIDs of the stored data the job consumed and of what its result is.
  repeated string input_blobs = 11;
  repeated string output_blobs = 12;
  // From 0 to 1: the mean of its tasks' progress.
  double progress = 13;
  // If not zero, how long any one attempt at a task may run.
  uint32 task_timeout_seconds = 14;
}

message JobTask {
  uint32 index = 1;
  JobState state = 2;
  // How many times it has been handed to a worker.
  uint32 attempt = 3;
  // The worker running it, or that last did.
  string peer_id = 4;
  string worker_name = 5;
  // Why its last failed attempt failed, if one did.
  string error = 6;
  // From 0 to 1, as far as the task itself says.
  double progress = 7;
}

message SubmitJobRequest {
  string workload = 1;
  bytes params = 2;
  JobMode mode = 3;
  // Distributed mode only: how many tasks to split into. Zero means one for
  // each worker slot connected now.
  uint32 max_tasks = 4;
  // If not zero, stop and retry any attempt at a task that runs longer.
  uint32 task_timeout_seconds = 5;
}

message SubmitJobResponse { Job job = 1; }

message CancelJobRequest { string job_id = 1; }

message CancelJobResponse { Job job = 1; }

message WatchJobEventsRequest {
  string job_id = 1;
  // Send only events numbered after this one. Zero sends them all.
  uint64 after_seq = 2;
}

message JobEvent {
  // Events of a job are numbered from one, in the order they happened.
  uint64 seq = 1;
  // Milliseconds since the Unix epoch.
  int64 at_ms = 2;
  // What happened: submitted, task-started, task-succeeded, task-failed,
  // task-lost, task-timed-out, log, succeeded, failed, cancelled, resumed.
  string kind = 3;
  // The task concerned, or -1 if the event is about the job as a whole.
  int32 task_index = 4;
  string worker_name = 5;
  string text = 6;
}

message GetJobRequest { string job_id = 1; }

message GetJobResponse { Job job = 1; }

message ListJobsRequest {}

message WatchJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
  uint64 revision = 2;
}
