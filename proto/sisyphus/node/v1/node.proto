message RemoveFileRequest { string cid = 1; }

message RemoveFileResponse {}

message GetJoinedPoolRequest {}

enum JoinedPoolState {
  JOINED_POOL_STATE_UNSPECIFIED = 0;
  // Not yet welcomed into the pool since the node started.
  JOINED_POOL_STATE_CONNECTING = 1;
  JOINED_POOL_STATE_CONNECTED = 2;
  // Welcomed once, and not connected now; it is trying again.
  JOINED_POOL_STATE_DISCONNECTED = 3;
}

message JoinedPool {
  // Empty until the coordinator has first welcomed the node.
  string coordinator_id = 1;
  string coordinator_name = 2;
  // Where the node reaches its coordinator, as it was told to.
  string address = 3;
  JoinedPoolState state = 4;
  // What the node may do in the pool, worker before client, as the
  // coordinator last said.
  repeated PoolRole roles = 5;
  // How many workers are connected to the pool, counting this node, as the
  // coordinator last said. Set only while the node is connected and holds
  // the client role; absent otherwise, so a count that is no longer live
  // is never shown as if it were.
  optional uint32 worker_count = 6;
}

enum PoolRole {
  POOL_ROLE_UNSPECIFIED = 0;
  // Runs tasks for the pool.
  POOL_ROLE_WORKER = 1;
  // Submits jobs to the pool and reads their results.
  POOL_ROLE_CLIENT = 2;
}

message CreateInvitationRequest {
  PoolRole role = 1;
  // How long the invitation can be used for. Zero means one hour.
  uint64 ttl_seconds = 2;
}

message CreateInvitationResponse {
  // What the joining machine is started with, as its --invitation.
  string invitation = 1;
  int64 expires_at_ms = 2;
}

