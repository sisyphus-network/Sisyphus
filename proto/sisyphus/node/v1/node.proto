enum SharedStateDomain {
  SHARED_STATE_DOMAIN_UNSPECIFIED = 0;
  SHARED_STATE_DOMAIN_NODE = 1;
  SHARED_STATE_DOMAIN_PEERS = 2;
  SHARED_STATE_DOMAIN_WORKERS = 3;
  SHARED_STATE_DOMAIN_PAIRED_BROWSERS = 4;
  SHARED_STATE_DOMAIN_JOINED_POOL = 5;
  SHARED_STATE_DOMAIN_MODEL_PROFILES = 6;
  SHARED_STATE_DOMAIN_MODEL_LENDING = 7;
  SHARED_STATE_DOMAIN_FILES = 8;
  SHARED_STATE_DOMAIN_POOL_LIMITS = 9;
  SHARED_STATE_DOMAIN_LOCATION_DISCOVERY = 10;
  SHARED_STATE_DOMAIN_WEB_ACCESS = 11;
}

message WatchSharedStateRequest {
  // Empty requests every domain supported by this daemon. Repeated values are
  // harmless and are treated as one subscription.
  repeated SharedStateDomain domains = 1;
}

message SharedStateEvent {
  // Increases for each event on this stream. A reconnect starts with a new
  // authoritative baseline and a new revision sequence.
  uint64 revision = 1;
  SharedStateDomain domain = 2;
  bool snapshot = 3;
  // A domain can temporarily be unavailable (for example, workers on a node
  // that coordinates no pool) without terminating other domain subscriptions.
  string error = 4;
  oneof state {
    NodeState node = 10;
    ListPeersResponse peers = 11;
    ListWorkersResponse workers = 12;
    PairedBrowsersState paired_browsers = 13;
    JoinedPool joined_pool = 14;
    ModelProfilesState model_profiles = 15;
    ModelLendingState model_lending = 16;
    ListFilesResponse files = 17;
    PoolLimitsState pool_limits = 18;
    LocationDiscoverySettingsState location_discovery = 19;
    WebAccessConfig web_access = 20;
  }
}

