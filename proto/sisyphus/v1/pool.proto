syntax = "proto3";

package sisyphus.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sisyphus-network/Sisyphus/packages/protocol/sisyphus/v1;sisyphusv1";

// PoolService manages which nodes a node will talk to. Every connection is
// TLS, with each side identified by its node key; this service decides which
// of those identities are admitted, and as what.
service PoolService {
  // Join admits the caller, in the role its token was issued for. Any node
  // may call it; a valid token is what gets it in. A token works once.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Swarm tells an admitted node how to reach the pool's private IPFS
  // network: the key its members share and where to find this node on it.
  // It fails if this node does not run one.
  rpc Swarm(SwarmRequest) returns (SwarmResponse);

  // IsMember says whether a node has been admitted to the pool. Workers use
  // it to decide whether to serve another node that asks them for a blob.
  rpc IsMember(IsMemberRequest) returns (IsMemberResponse);

  // Relays lists the members that relay between the others, besides this
  // node itself. A worker keeps a place on each, so that it can be reached
  // through any of them.
  rpc Relays(RelaysRequest) returns (RelaysResponse);

  // The rest may be called only by the node's owner: its own command line.

  // Invite issues a token for one node to join with.
  rpc Invite(InviteRequest) returns (InviteResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // RemoveMember takes a node off the list and, if it is a connected worker,
  // disconnects it. If the pool has a private IPFS network its key is
  // changed, since the removed node still holds the old one.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // SetWorkFor says whether this node is willing to take tasks from another.
  // It works for that node only while that node, for its part, has admitted
  // it as a worker.
  rpc SetWorkFor(SetWorkForRequest) returns (SetWorkForResponse);
  // Rekey changes the key of the pool's private IPFS network. Connected
  // workers are told and fetch the new one; anything else holding the old
  // key is shut out.
  rpc Rekey(RekeyRequest) returns (RekeyResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  // May take tasks and move the blobs they need.
  ROLE_WORKER = 1;
  // May submit and inspect jobs and manage stored data.
  ROLE_CLIENT = 2;
}

message JoinRequest {
  string token = 1;
}

message JoinResponse {
  Role role = 1;
}

message IsMemberRequest {
  string node_id = 1;
}

message IsMemberResponse {
  bool member = 1;
}

message RelaysRequest {}

message RelaysResponse {
  // Multiaddresses, each ending in /p2p/ and the relay's ID.
  repeated string addresses = 1;
}

message SwarmRequest {}

message SwarmResponse {
  // The contents of the swarm.key file that every member's Kubo daemon
  // needs. Whoever holds it can join the network, so it is given only to
  // admitted nodes and only over their encrypted connection.
  string swarm_key = 1;
  // Addresses of the Kubo daemons on the network, each ending in
  // /p2p/<peer ID>. Those of this node's own daemon are absent if it accepts
  // no connections from outside; it is then reached through
  // TunnelService.Open.
  repeated string addresses = 2;
}

message InviteRequest {
  Role role = 1;
  // How long the invitation can be used for. Zero means one hour.
  uint64 ttl_seconds = 2;
}

message InviteResponse {
  // The invitation to hand to the joining node: this node's ID and the
  // token, as "<node ID>:<token>". The ID lets the joiner be sure it is
  // talking to the node that invited it.
  string invitation = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
  // The IDs of the nodes this one is willing to take tasks from.
  repeated string works_for = 2;
}

message SetWorkForRequest {
  string node_id = 1;
  bool willing = 2;
}

message SetWorkForResponse {}

message Member {
  string node_id = 1;
  Role role = 2;
  google.protobuf.Timestamp joined_at = 3;
}

message RemoveMemberRequest {
  string node_id = 1;
}

message RemoveMemberResponse {}

message RekeyRequest {}

message RekeyResponse {
  string swarm_fingerprint = 1;
}
