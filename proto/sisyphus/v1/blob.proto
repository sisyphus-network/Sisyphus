syntax = "proto3";

package sisyphus.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sisyphus-network/Sisyphus/packages/protocol/sisyphus/v1;sisyphusv1";

// BlobService moves content-addressed artifacts to and from a node's store.
// Blobs are named by the CID that `ipfs add --cid-version=1` gives the same
// bytes.
service BlobService {
  // Put stores the concatenation of every message's data as one blob.
  rpc Put(stream PutBlobRequest) returns (PutBlobResponse);
  // Get streams a blob's bytes in order. Receivers should check that what
  // they received hashes to the CID they asked for.
  rpc Get(GetBlobRequest) returns (stream GetBlobResponse);
  rpc Stat(StatBlobRequest) returns (StatBlobResponse);
  // Locate names other workers of the pool believed to hold a blob and
  // willing to serve it, so that a worker can fetch it from one of them
  // rather than from the coordinator. The answer is a hint: a worker listed
  // may have dropped the blob since.
  rpc Locate(LocateBlobRequest) returns (LocateBlobResponse);

  // A node keeps a blob for as long as something pins it. Pin and Unpin act
  // on the pin held on behalf of the node's user; jobs hold their own.
  rpc Pin(PinBlobRequest) returns (PinBlobResponse);
  rpc Unpin(UnpinBlobRequest) returns (UnpinBlobResponse);
  rpc ListPins(ListPinsRequest) returns (ListPinsResponse);
  // CollectGarbage drops pins that have expired and deletes every block no
  // remaining pin reaches.
  rpc CollectGarbage(CollectGarbageRequest) returns (CollectGarbageResponse);

  // A node that coordinates a pool can have other members, its storage
  // followers, each keep a copy of what it has pinned.

  // Replicate is how a follower learns what to hold. It says what it holds
  // and is told what it should: it fetches what it lacks with Get and drops
  // the rest. Asking is also how the node knows the follower is there, so a
  // follower asks again every so often.
  //
  // What the node tells a follower to hold it signs, and the follower keeps
  // the signed list. A node that has lost its store asks to be shown the
  // list, checks that the signature is its own, and takes back what the
  // list names. A follower's word alone brings nothing back.
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
  // Replicas reports which followers hold each blob the node has pinned,
  // against how many should.
  rpc Replicas(ReplicasRequest) returns (ReplicasResponse);
  // Restore is for a node whose store was lost and replaced, and which
  // cannot take back by itself what its followers hold from the store it
  // had before: because it has lost its key too, or because a follower has
  // no list it signed. It fetches those blobs back on the followers' word
  // and pins them on behalf of the node's user.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
}

message PutBlobRequest {
  bytes data = 1;
}

message PutBlobResponse {
  string cid = 1;
  uint64 size = 2;
}

message GetBlobRequest {
  string cid = 1;
}

message GetBlobResponse {
  bytes data = 1;
}

message StatBlobRequest {
  string cid = 1;
}

message StatBlobResponse {
  uint64 size = 1;
}

message LocateBlobRequest {
  string cid = 1;
}

message LocateBlobResponse {
  repeated BlobHolder holders = 1;
}

message BlobHolder {
  string node_id = 1;
  // host:port of the holder's blob service.
  string address = 2;
}

message PinBlobRequest {
  string cid = 1;
  // How long to keep the blob. Zero means until it is unpinned.
  uint64 ttl_seconds = 2;
}

message PinBlobResponse {}

message UnpinBlobRequest {
  string cid = 1;
}

message UnpinBlobResponse {}

message ListPinsRequest {}

message ListPinsResponse {
  repeated Pin pins = 1;
}

message Pin {
  string cid = 1;
  // Who holds the pin: "user", "job:<id>", or "recent" for the short pin
  // every newly stored blob gets. In a follower's store of copies it is
  // "pool:" and the ID of the store they are copies of. "restored" is on
  // what a node that lost its store took back from its followers.
  string owner = 2;
  // Unset for a pin that holds until released.
  google.protobuf.Timestamp expires_at = 3;
}

message CollectGarbageRequest {}

message CollectGarbageResponse {
  uint32 expired_pins = 1;
  uint64 blocks_removed = 2;
  uint64 bytes_freed = 3;
}

message ReplicateRequest {
  // The CIDs of the blobs the follower holds for the pool.
  repeated string holding = 1;
  // The store those are copies of, as the node named it in its last answer.
  // Empty for a follower that holds nothing.
  string store = 2;
  // The last list the node signed for this follower, handed back when the
  // node asked to be shown it.
  KeepList list = 3;
  // Set by a follower that keeps the node's signed lists. It is then told
  // what to hold in a list alone, and hold is left empty.
  bool keeps_lists = 4;
  // Set by a follower that answers challenges: asked to show it holds a
  // blob, it asks again at once with its answers.
  bool answers_challenges = 5;
  // Its answers to the challenges in the node's last reply.
  repeated ChallengeAnswer answers = 6;
}

// Challenge asks a follower to show that it holds a blob now: to return a
// digest that only a holder of the bytes named could have made.
message Challenge {
  string cid = 1;
  // The part of the blob asked about: length bytes from offset.
  uint64 offset = 2;
  uint32 length = 3;
  // Random, and never used twice, so that an answer cannot be kept.
  bytes nonce = 4;
}

// ChallengeAnswer is SHA-256 of a challenge's nonce followed by the bytes
// it named. An empty digest says the follower cannot answer.
message ChallengeAnswer {
  string cid = 1;
  bytes nonce = 2;
  bytes digest = 3;
}

message ReplicateResponse {
  // Everything the follower should hold from now on, and nothing else.
  // Empty if list is set: the list then says the same.
  repeated string hold = 1;
  // What to give as the store next time.
  string store = 2;
  // What the follower should hold, signed, for it to keep in place of the
  // list it had. Unset while the follower holds blobs from an earlier store
  // that the node has not taken back: the list it has is then the only
  // proof of what that store kept.
  KeepList list = 3;
  // Set when the follower holds blobs from a store other than the node's
  // present one and gave no list. It should ask again at once, with the
  // list it has.
  bool show_list = 4;
  // Blobs the follower says it holds and is asked to show that it does. It
  // should ask again at once, with its answers.
  repeated Challenge challenges = 5;
}

// KeepList is a node's statement of what one follower is to hold, signed so
// that the node can later tell it for its own.
message KeepList {
  // The store the list is of: the node's ID, "/", and the store's name.
  string store = 1;
  // When the node signed the list, in nanoseconds since 1970, or one more
  // than its last if its clock had not moved on. It only goes up.
  uint64 sequence = 2;
  repeated KeptBlob blobs = 3;
  // The node's signature, with its node key, of this encoding of the fields
  // above, in which every number is eight bytes, most significant first:
  // the text "sisyphus keep list v1" and a newline; the length of store and
  // store; the sequence; the number of blobs; and for each blob the length
  // of its CID, the CID, and either a zero byte, if it has no keep_until,
  // or a one byte and keep_until in nanoseconds since 1970.
  bytes signature = 4;
}

message KeptBlob {
  string cid = 1;
  // The latest expiry of the node's pins on the blob. Unset if one of them
  // holds until released.
  google.protobuf.Timestamp keep_until = 2;
}

message ReplicasRequest {
  // If set, report on this blob only.
  string cid = 1;
}

message ReplicasResponse {
  // How many followers should hold each blob. Zero means none are asked to.
  uint32 wanted = 1;
  // The IDs of the followers the node has heard from lately.
  repeated string followers = 2;
  repeated ReplicatedBlob blobs = 3;
  // Set for a while after the node starts, when blobs it already had are
  // not yet handed to followers that lack them: those that held copies
  // before are given time to say so first.
  bool settling = 4;
  // How many blobs followers hold from a store the node had before and
  // has not pinned in the one it has now.
  uint32 from_earlier_store = 5;
  // Set while the node is taking back what a list it signed names.
  bool restoring = 6;
  // How many blobs the node has pinned as "restored": those it took back
  // by itself and is still keeping.
  uint32 restored = 7;
  // How many of from_earlier_store no list signed by the node covers. The
  // node does not take these back by itself; Restore does.
  uint32 unsigned_from_earlier_store = 8;
  // How many times, since the node started, a follower failed to show that
  // it held a blob it said it held.
  uint32 challenges_failed = 9;
}

message ReplicatedBlob {
  string cid = 1;
  // The IDs of the followers that say they hold it.
  repeated string holders = 2;
  // Those of them that have shown they hold it, by answering a challenge
  // on it since they began to.
  repeated string shown = 3;
}

message RestoreRequest {}

message RestoreResponse {
  // How many blobs were fetched back and pinned.
  uint32 restored = 1;
  // The CIDs of those that could not be.
  repeated string failed = 2;
}
