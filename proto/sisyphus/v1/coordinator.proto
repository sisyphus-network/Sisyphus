syntax = "proto3";

package sisyphus.v1;

import "sisyphus/v1/types.proto";

option go_package = "github.com/excho0/Sisyphus/packages/protocol/sisyphus/v1;sisyphusv1";

// CoordinatorService is the worker-facing side of a coordinator.
service CoordinatorService {
  // Connect is dialled by the worker and held open for as long as it belongs
  // to the pool, so workers behind NAT need no inbound port. The first
  // message on the stream must be a Hello.
  rpc Connect(stream WorkerMessage) returns (stream CoordinatorMessage);
}

message WorkerMessage {
  oneof kind {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    TaskResult task_result = 3;
  }
}

message Hello {
  // Field 1 was a self-declared node ID. A node's ID now comes from the key
  // it connects with, and nothing it says can change it.
  reserved 1;
  NodeCapabilities capabilities = 2;
  // A label for people to recognise the node by. It need not be unique.
  string name = 3;
}

message Heartbeat {
  uint32 running_tasks = 1;
}

message TaskResult {
  string task_id = 1;
  // Echoes TaskAssignment.attempt so the coordinator can drop stale results.
  uint32 attempt = 2;
  oneof outcome {
    bytes output = 3;
    string error = 4;
  }
  // CIDs of the stored blobs the task opened and stored. The coordinator
  // uses them to keep a job's data for as long as the job needs it.
  repeated string read_blobs = 5;
  repeated string written_blobs = 6;
}

message CoordinatorMessage {
  oneof kind {
    Welcome welcome = 1;
    TaskAssignment assignment = 2;
    SwarmUpdate swarm_update = 3;
  }
}

message Welcome {
  string coordinator_id = 1;
  // Identifies the key of the pool's private IPFS network without giving it
  // away; empty if the pool has no such network. A worker whose own Kubo is
  // on a different key should ask PoolService.Swarm for the current one.
  string swarm_fingerprint = 2;
}

// SwarmUpdate tells a connected worker that the key of the pool's private
// IPFS network has changed, as it does when a member is removed.
message SwarmUpdate {
  string swarm_fingerprint = 1;
}

message TaskAssignment {
  string task_id = 1;
  string job_id = 2;
  uint32 attempt = 3;
  string workload = 4;
  bytes payload = 5;
}
