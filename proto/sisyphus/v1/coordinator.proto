syntax = "proto3";

package sisyphus.v1;

import "sisyphus/v1/types.proto";

option go_package = "github.com/sisyphus-network/Sisyphus/packages/protocol/sisyphus/v1;sisyphusv1";

// CoordinatorService is the worker-facing side of a coordinator.
service CoordinatorService {
  // Connect is dialled by the worker and held open for as long as it belongs
  // to the pool, so workers behind NAT need no inbound port. The first
  // message on the stream must be a Hello.
  rpc Connect(stream WorkerMessage) returns (stream CoordinatorMessage);
}

message WorkerMessage {
  oneof kind {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    TaskResult task_result = 3;
    TaskUpdate task_update = 4;
  }
}

// TaskUpdate is news of a task still running: how far along it is, and
// what it has logged since the last one.
message TaskUpdate {
  string task_id = 1;
  uint32 attempt = 2;
  double progress = 3;
  repeated string log = 4;
}

message Hello {
  // Field 1 was a self-declared node ID. A node's ID now comes from the key
  // it connects with, and nothing it says can change it.
  reserved 1;
  NodeCapabilities capabilities = 2;
  // A label for people to recognise the node by. It need not be unique.
  string name = 3;
  // Where other workers of the pool can fetch blobs from this one, as
  // host:port, or empty if it does not serve them.
  string serve_address = 4;
  // Where this node's libp2p host can be reached, if it relays between the
  // pool's members: multiaddresses ending in /p2p/ and its ID. Empty for a
  // node that does not relay.
  repeated string relay_addresses = 5;
  // The coordinator's address as this worker reached it: the remote address
  // of the connection it made, not the name it was given. The coordinator
  // places itself by what most of its workers say here, and only if that is
  // a global unicast address; it is for display, never for reachability.
  string dialled_address = 6;
}

message Heartbeat {
  uint32 running_tasks = 1;
  // What the node has relayed between other members since it started: how
  // many times it joined two of them, and how many bytes passed.
  uint64 relayed_connections = 2;
  uint64 relayed_bytes = 3;
  // Set when the worker's labels are not what it last said they were: a
  // model fetched or removed since. Absent, they are as they were.
  Labels labels = 4;
}

message Labels { repeated string labels = 1; }

message TaskResult {
  string task_id = 1;
  // Echoes TaskAssignment.attempt so the coordinator can drop stale results.
  uint32 attempt = 2;
  oneof outcome {
    bytes output = 3;
    string error = 4;
  }
  // CIDs of the stored blobs the task opened and stored. The coordinator
  // uses them to keep a job's data for as long as the job needs it.
  repeated string read_blobs = 5;
  repeated string written_blobs = 6;
  // What a model task says it ran with, whether it succeeded or failed;
  // unset for work that asks no model server.
  ModelUse used = 7;
}

// ModelUse is what a model task's worker says it ran with. It is the
// worker's own account, kept so that an owner's settings show and a later
// check has something to check against. It proves nothing.
message ModelUse {
  // The kind of model server, "ollama", and the version it says it is.
  string server = 1;
  string version = 2;
  // The model as the request named it, and what the server says of the
  // model it has by that name. Empty where it would not say.
  string model = 3;
  string digest = 4;
  string quantization = 5;
  // The options sent to the server, as JSON, the owner's own included.
  bytes options = 6;
}

message CoordinatorMessage {
  oneof kind {
    Welcome welcome = 1;
    TaskAssignment assignment = 2;
    SwarmUpdate swarm_update = 3;
    TaskCancel cancel = 4;
  }
}

// TaskCancel tells a worker to stop a task it was given. Nothing is expected
// back: whatever the task goes on to report is ignored.
message TaskCancel {
  string task_id = 1;
  uint32 attempt = 2;
}

message Welcome {
  string coordinator_id = 1;
  // Identifies the key of the pool's private IPFS network without giving it
  // away; empty if the pool has no such network. A worker whose own Kubo is
  // on a different key should ask PoolService.Swarm for the current one.
  string swarm_fingerprint = 2;
  // The worker's address as the coordinator sees it: the source address of
  // its connection. The worker places itself by it, if it is a global
  // unicast address; it is for display, never for reachability.
  string observed_address = 3;
}

// SwarmUpdate tells a connected worker that the key of the pool's private
// IPFS network has changed, as it does when a member is removed.
message SwarmUpdate {
  string swarm_fingerprint = 1;
}

message TaskAssignment {
  string task_id = 1;
  string job_id = 2;
  uint32 attempt = 3;
  string workload = 4;
  bytes payload = 5;
  // A sealing key whole. It was once the key of every private job. It is
  // now given only with keys, and only when the job names an input sealed
  // before keys were derived, which nothing less opens.
  bytes key = 6;
  // For a private job: the keys its tasks may use, each derived from the
  // submitter's sealing key. The first is the job's own, which what a task
  // stores is sealed with; the rest open the sealed inputs the job names.
  repeated SealingKey keys = 7;
  // What the coordinator gave the task to this worker for having: the
  // labels its job needs. A worker that does not have one of them, other
  // than its own name, which the coordinator gives it, refuses the task,
  // whatever the coordinator is.
  repeated string needs = 8;
}

// SealingKey is one key derived from a sealing key, and its ID.
message SealingKey {
  bytes id = 1;
  bytes key = 2;
}
