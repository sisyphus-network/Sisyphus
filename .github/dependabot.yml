# Keeps the actions, Go modules and the desktop app's packages current.
# Updates come weekly, grouped so that each ecosystem is one pull request,
# and pass the same checks as any other change before they merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [infra, dependencies]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # The upstream repository also has a legacy v6.0.23+incompatible tag.
    # Dependabot treats it as newer than the maintained v0.x line, but its
    # removed package paths make the Go module graph unresolvable.
    ignore:
      - dependency-name: github.com/libp2p/go-libp2p
        versions: ["6.0.23+incompatible"]
    groups:
      go:
        patterns: ["*"]
    labels: [area:daemon, dependencies]
  - package-ecosystem: npm
    directory: /apps/sisyphus
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [area:client, dependencies]
