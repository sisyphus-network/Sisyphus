name: Desktop packaging

on:
  pull_request:
    # labeled is heard only so that adding all-platforms packages all six.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]

permissions:
  contents: read

# A pull request's newer push replaces its older run, which frees the
# runners for others. Pushes to dev are never cancelled: each commit there
# keeps its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'all-platforms') && github.run_id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.event.action != 'labeled' || github.event.label.name == 'all-platforms'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ contains(github.event.pull_request.labels.*.name, 'all-platforms') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$ALL" = true ] ||
            git diff --name-only "$BASE" HEAD | grep -qvE '(^|/)[^/]+\.md$|^docs/|^CITATION\.cff$|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Every system and processor the app ships for, each built on its
        # own: Linux, Windows and macOS, on x64 and on arm64, for each push
        # to dev and for a pull request labelled all-platforms. Other pull
        # requests build the three most people run, since the account has
        # twenty runners at a time to share between every pull request.
        os: ${{ fromJSON((github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'all-platforms')) && '["ubuntu-26.04","ubuntu-26.04-arm","windows-2025","windows-11-arm","macos-26","macos-26-intel"]' || '["ubuntu-26.04","windows-2025","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/sisyphus
    env:
      # CI artifacts are unsigned test builds, never automatically published.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sisyphus/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package
        shell: bash
        # macOS's hdiutil sometimes cannot detach the disk image it just
        # built ("Resource busy"), which fails the build after everything
        # has worked. That one failure is tried again, once; any other is not.
        run: |
          if ! npm run package:dist 2>&1 | tee package.log; then
            if [ "$RUNNER_OS" = macOS ] && grep -q "Unable to detach device cleanly" package.log; then
              echo "::warning::hdiutil could not detach the disk image; packaging again"
              npm run package:dist
            else
              exit 1
            fi
          fi
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        with:
          name: sisyphus-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/sisyphus/dist/*.zip
            apps/sisyphus/dist/*.tar.gz
            apps/sisyphus/dist/*.AppImage
            apps/sisyphus/dist/*-setup.exe
            apps/sisyphus/dist/*.dmg
          if-no-files-found: error
          retention-days: 7
