name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fail, rather than skip, any test that finds no ipfs program.
      SISYPHUS_REQUIRE_KUBO: "1"
      # Likewise any that finds it cannot use Docker.
      SISYPHUS_REQUIRE_DOCKER: "1"
      # Or that finds no ipfs-cluster-service program.
      SISYPHUS_REQUIRE_CLUSTER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Kubo
        # Some tests run a real IPFS daemon. The version is pinned so that a
        # new release cannot change test results unannounced.
        env:
          KUBO_VERSION: v0.43.1
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$KUBO_VERSION" -R ipfs/kubo \
            -p "kubo_${KUBO_VERSION}_linux-amd64.tar.gz" -p "kubo_${KUBO_VERSION}_linux-amd64.tar.gz.sha512"
          echo "$(cut -d' ' -f1 "kubo_${KUBO_VERSION}_linux-amd64.tar.gz.sha512")  kubo_${KUBO_VERSION}_linux-amd64.tar.gz" | sha512sum -c -
          tar -xzf "kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          sudo install -m 755 kubo/ipfs /usr/local/bin/ipfs
          rm -rf kubo "kubo_${KUBO_VERSION}_linux-amd64.tar.gz"*
          ipfs version
      - name: Install IPFS Cluster
        # Some tests run real cluster peers beside those IPFS daemons. The
        # project publishes no checksums beside its releases, so the one
        # here was taken from the release when the version was chosen.
        env:
          CLUSTER_VERSION: v1.1.6
          CLUSTER_SHA256: 813a5d9f51359b0a55961f57f5e4d92de8031835502c9fa69821ef89d87ef584
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CLUSTER_VERSION" -R ipfs-cluster/ipfs-cluster \
            -p "ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz"
          echo "$CLUSTER_SHA256  ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz"
          sudo install -m 755 ipfs-cluster-service/ipfs-cluster-service /usr/local/bin/ipfs-cluster-service
          rm -rf ipfs-cluster-service "ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz"
          ipfs-cluster-service --version
      - name: Check formatting
        run: test -z "$(gofmt -l apps packages)" || { gofmt -l apps packages; exit 1; }
      - run: go vet ./...
      - name: Check for mistakes vet does not look for
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - run: go test -race ./...
      - name: Check every statement is tested
        run: make cover
      - run: go build ./apps/sisyphusd

  # A pool across machines, as near as one runner gets: each node in a
  # container with its own address and disk. It is what finds faults that
  # tests on one machine cannot, since those all run over loopback.
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Rehearse a pool across containers
        run: examples/rehearsal.sh

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sisyphus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sisyphus/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build matching daemon for desktop lifecycle acceptance
        working-directory: .
        run: go build -o bin/sisyphusd ./apps/sisyphusd
      - run: npm run test:daemon
      - run: npm run build
      # The real app, built above, driven in a window nobody sees against
      # the daemon built above, on a node and a profile of the tests' own.
      - name: End-to-end tests of the desktop app
        run: npm run test:e2e
