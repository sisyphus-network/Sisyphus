name: CI

on:
  push:
    branches: [dev]
  pull_request:
    # Not labeled: a label's run would show its skipped jobs under the same
    # names as a real run's, in place of their results (#446). Adding
    # all-platforms re-runs this instead (.github/workflows/all-platforms.yml).
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# A pull request's newer push replaces its older run, which frees the
# runners for others. Pushes to dev are never cancelled: each commit there
# keeps its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide in a job rather than filtering the workflow event: a docs-only PR
  # can then be explicitly checked with the all-platforms label.
  scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
      platforms: ${{ steps.scope.outputs.platforms }}
      realimages: ${{ steps.scope.outputs.realimages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: labels
        # Read from the pull request as it is now, not from the event: a
        # re-run keeps its first event, and all-platforms is added later and
        # re-runs this (.github/workflows/all-platforms.yml).
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "all=$(gh api "repos/$REPO/issues/$NUMBER/labels" --jq 'any(.[]; .name == "all-platforms")')" >> "$GITHUB_OUTPUT"
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ steps.labels.outputs.all }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$ALL" = true ] ||
            git diff --name-only "$BASE" HEAD | grep -qvE '(^|/)[^/]+\.md$|^docs/|^CITATION\.cff$|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENT" != pull_request ] || [ "$ALL" = true ] ||
            git diff --name-only "$BASE" HEAD | grep -qE '^(packages/|apps/sisyphusd/|go\.(mod|sum)$|scripts/build-release\.sh$|\.github/workflows/)'; then
            echo platforms=true >> "$GITHUB_OUTPUT"
          else
            echo platforms=false >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENT" != pull_request ] || [ "$ALL" = true ] ||
            git diff --name-only "$BASE" HEAD | grep -qE '^(packages/runtime/|go\.(mod|sum)$|Makefile$|\.github/workflows/)'; then
            echo realimages=true >> "$GITHUB_OUTPUT"
          else
            echo realimages=false >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    # On the project's disposable runners (sisyphus-ci): each job gets a fresh
    # container of its own, with its own network, /tmp and Docker, so jobs run
    # side by side rather than queuing behind one host-wide lock, and none of
    # them counts against the account's 20 hosted jobs. Fork and Dependabot
    # pull requests stay on GitHub's runners, so only this repository's own
    # code runs on the project's machine.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-26.04' || 'sisyphus-ci' }}
    timeout-minutes: 45
    env:
      # Harmless on a machine of the job's own, and still what keeps the
      # integration steps from sharing ports with each other.
      SISYPHUS_CI_LOCAL_NETWORK_LOCK: /tmp/sisyphus-ci-local-network.lock
      # Fail, rather than skip, any test that finds no ipfs program.
      SISYPHUS_REQUIRE_KUBO: "1"
      # Likewise any that finds it cannot use Docker.
      SISYPHUS_REQUIRE_DOCKER: "1"
      # Or that finds no ipfs-cluster-service program.
      SISYPHUS_REQUIRE_CLUSTER: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Test release download retry helper
        run: bash .github/scripts/test-download-release-assets.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install Kubo
        # Some tests run a real IPFS daemon. The version is pinned so that a
        # new release cannot change test results unannounced.
        env:
          KUBO_VERSION: v0.43.1
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/download-release-assets.sh "$KUBO_VERSION" -R ipfs/kubo \
            -p "kubo_${KUBO_VERSION}_linux-amd64.tar.gz" -p "kubo_${KUBO_VERSION}_linux-amd64.tar.gz.sha512"
          echo "$(cut -d' ' -f1 "kubo_${KUBO_VERSION}_linux-amd64.tar.gz.sha512")  kubo_${KUBO_VERSION}_linux-amd64.tar.gz" | sha512sum -c -
          tar -xzf "kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          install -Dm 755 kubo/ipfs "$HOME/.local/bin/ipfs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf kubo "kubo_${KUBO_VERSION}_linux-amd64.tar.gz"*
          ipfs version
      - name: Install IPFS Cluster
        # Some tests run real cluster peers beside those IPFS daemons. The
        # project publishes no checksums beside its releases, so the one
        # here was taken from the release when the version was chosen.
        env:
          CLUSTER_VERSION: v1.1.6
          CLUSTER_SHA256: 813a5d9f51359b0a55961f57f5e4d92de8031835502c9fa69821ef89d87ef584
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/download-release-assets.sh "$CLUSTER_VERSION" -R ipfs-cluster/ipfs-cluster \
            -p "ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz"
          echo "$CLUSTER_SHA256  ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz"
          install -Dm 755 ipfs-cluster-service/ipfs-cluster-service "$HOME/.local/bin/ipfs-cluster-service"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf ipfs-cluster-service "ipfs-cluster-service_${CLUSTER_VERSION}_linux-amd64.tar.gz"
          ipfs-cluster-service --version
      - name: Pull the images the tests start
        # The S3 tests start the object store; the container and transcode
        # tests start alpine:3.20. A self-hosted runner's Docker begins each
        # job empty, so pulled here, a download Docker Hub cuts off or stalls
        # is tried again rather than failing whichever test asked first, and
        # the tests find the images already on the machine.
        run: |
          for image in chrislusf/seaweedfs:latest alpine:3.20; do
            for attempt in 1 2 3 4 5; do
              timeout 300 docker pull "$image" && continue 2
              echo "pull of $image, attempt $attempt, failed; trying again"
              sleep $((attempt * 10))
            done
            exit 1
          done
      - name: Check formatting
        run: test -z "$(gofmt -l apps packages)" || { gofmt -l apps packages; exit 1; }
      - run: go vet ./...
      - name: Check the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check for mistakes vet does not look for
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Test against real local services
        # Each Go package test process has its own test-only port allocator.
        # Keep packages sequential as well as keeping this step exclusive with
        # other localhost-heavy workflows on the shared host. The daemon's
        # package runs whole pools under the race detector and outgrew go
        # test's default of 10 minutes per package; the job's own limit still
        # bounds the step. The full coverage pass below includes the
        # real-image tests; this job also runs that tagged subset under the
        # race detector with a longer timeout.
        run: flock "$SISYPHUS_CI_LOCAL_NETWORK_LOCK" go test -race -p 1 -timeout 25m ./...
      - name: Check every statement is tested
        run: |
          flock "$SISYPHUS_CI_LOCAL_NETWORK_LOCK" bash -euo pipefail -c '
            # Coverage runs the same integration tests as above. Keep their
            # package processes sequential so test-only ports cannot overlap.
            export GOFLAGS="-p=1"
            if command -v make >/dev/null 2>&1; then
              make cover
            else
              nix develop --command make cover
            fi
          '
      - run: go build ./apps/sisyphusd

  realimages:
    needs: [scope, test]
    if: needs.scope.outputs.realimages == 'true'
    # Real image builds can take substantially longer than unit tests on a
    # cold runner. Keep them isolated so they do not consume the ordinary
    # suite's per-package timeout.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-26.04' || 'sisyphus-ci' }}
    timeout-minutes: 90
    env:
      SISYPHUS_CI_LOCAL_NETWORK_LOCK: /tmp/sisyphus-ci-local-network.lock
      SISYPHUS_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Pull the base image used by real workloads
        run: docker pull alpine:3.20
      - name: Run the real-image workload tests
        run: >-
          flock "$SISYPHUS_CI_LOCAL_NETWORK_LOCK" go test -race -tags=realimages -p 1
          -timeout 60m
          -run '^(TestARealVideoIsTranscodedInStretches|TestRealReplicasAreSimulated|TestARealSceneIsRendered|TestRealSpeechIsTranscribedInStretches|TestARealConformerSetIsOptimised)$'
          ./packages/runtime

  # Known-answer workloads must agree across real CPU architectures and OSes,
  # not only compile for them. These tests avoid the daemon's service fixtures.
  workload-architecture:
    needs: scope
    if: needs.scope.outputs.platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
          - runner: macos-26
            goos: darwin
            goarch: arm64
          - runner: macos-26-intel
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    # The build itself takes minutes, but a hosted macOS runner has spent
    # eleven of them only checking the code out over a slow network.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify runner platform
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
      - name: Build the daemon for the release target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./apps/sisyphusd
      - name: Check known-answer workloads
        run: >-
          go test ./packages/runtime
          -run '^(TestCountPrimes|TestPrimesSplitExecuteAggregate|TestIsqrtIsExactAcrossThePrimesRange|TestCountWordsOverTheWholeText|TestCountWordsIsUnaffectedByWhereRangesAreCut|TestWordCountProducesASortedTable|TestWordCountResultCIDIsTheSameHoweverTheJobIsSplit)$'

  # The other systems and processors a release is built for, which GitHub
  # has no runner of: the tests are compiled for each and run in an emulator
  # of the processor, on the Android build's own processor (loaded by Linux's
  # loader, since it asks for Android's, which it needs only to be placed in
  # memory), or in a virtual machine of the BSD, an emulated ARM64 one for
  # FreeBSD and OpenBSD on ARM64. s390x is big-endian, so it shows that an answer does
  # not depend on byte order.
  workload-elsewhere:
    needs: scope
    if: needs.scope.outputs.platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-26.04, goos: linux, goarch: riscv64, via: qemu-riscv64}
          - {runner: ubuntu-26.04, goos: linux, goarch: arm, via: qemu-arm}
          - {runner: ubuntu-26.04, goos: linux, goarch: ppc64le, via: qemu-ppc64le}
          - {runner: ubuntu-26.04, goos: linux, goarch: s390x, via: qemu-s390x}
          - {runner: ubuntu-26.04, goos: linux, goarch: loong64, via: qemu-loongarch64}
          - {runner: ubuntu-26.04, goos: linux, goarch: "386", via: ""}
          - {runner: ubuntu-26.04-arm, goos: android, goarch: arm64, via: /lib/ld-linux-aarch64.so.1}
          - {runner: ubuntu-26.04, goos: freebsd, goarch: arm64, via: vm}
          - {runner: ubuntu-26.04, goos: freebsd, goarch: amd64, via: vm}
          - {runner: ubuntu-26.04, goos: openbsd, goarch: arm64, via: vm}
          - {runner: ubuntu-26.04, goos: openbsd, goarch: amd64, via: vm}
          - {runner: ubuntu-26.04, goos: netbsd, goarch: amd64, via: vm}
    name: workload-elsewhere (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      KNOWN_ANSWERS: '^(TestCountPrimes|TestPrimesSplitExecuteAggregate|TestIsqrtIsExactAcrossThePrimesRange|TestCountWordsOverTheWholeText|TestCountWordsIsUnaffectedByWhereRangesAreCut|TestWordCountProducesASortedTable|TestWordCountResultCIDIsTheSameHoweverTheJobIsSplit)$'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compile the tests for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: "7"
        run: go test -c -o packages/runtime/runtime.test ./packages/runtime
      - name: Build the daemon for the release target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: "7"
        run: |
          if [ "$GOOS" = android ]; then
            # Match build-release.sh: anet uses a standard-library linkname on Android.
            go build -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/sisyphusd" ./apps/sisyphusd
          else
            go build -o "$RUNNER_TEMP/sisyphusd" ./apps/sisyphusd
          fi
      - name: Install the emulator
        if: startsWith(matrix.via, 'qemu')
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run the known-answer workloads
        if: matrix.via != 'vm' && matrix.via != 'build-only'
        working-directory: packages/runtime
        run: ${{ matrix.via }} ./runtime.test -test.v -test.run "$KNOWN_ANSWERS"
      - name: Run the known-answer workloads on FreeBSD
        if: matrix.goos == 'freebsd' && matrix.via == 'vm'
        uses: vmactions/freebsd-vm@v1
        with:
          # The tests' answer is all that is wanted back, and copying the
          # VM's files back has failed on its own (tar on FreeBSD/arm64).
          copyback: false
          arch: ${{ matrix.goarch == 'arm64' && 'aarch64' || '' }}
          sync: ${{ matrix.goarch == 'arm64' && 'tar' || 'rsync' }}
          envs: KNOWN_ANSWERS
          run: cd packages/runtime && ./runtime.test -test.v -test.run "$KNOWN_ANSWERS"
      - name: Run the known-answer workloads on OpenBSD
        if: matrix.goos == 'openbsd' && matrix.via == 'vm'
        uses: vmactions/openbsd-vm@v1
        with:
          # The tests' answer is all that is wanted back, and copying the
          # VM's files back has failed on its own (tar on FreeBSD/arm64).
          copyback: false
          arch: ${{ matrix.goarch == 'arm64' && 'aarch64' || '' }}
          envs: KNOWN_ANSWERS
          run: cd packages/runtime && ./runtime.test -test.v -test.run "$KNOWN_ANSWERS"
      - name: Run the known-answer workloads on NetBSD
        if: matrix.goos == 'netbsd' && matrix.via == 'vm'
        uses: vmactions/netbsd-vm@v1
        with:
          # The tests' answer is all that is wanted back, and copying the
          # VM's files back has failed on its own (tar on FreeBSD/arm64).
          copyback: false
          envs: KNOWN_ANSWERS
          run: cd packages/runtime && ./runtime.test -test.v -test.run "$KNOWN_ANSWERS"

  # A pool across machines, as near as one runner gets: each node in a
  # container with its own address and disk. It is what finds faults that
  # tests on one machine cannot, since those all run over loopback.
  rehearsal:
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    # Where test runs, and for the same reasons; the container's own Docker
    # keeps the rehearsal's fixed container names off every other job's.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-26.04' || 'sisyphus-ci' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Rehearse a pool across containers
        run: examples/rehearsal.sh

  desktop:
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    # Electron E2E must never attach to the maintainer's interactive desktop,
    # so desktop checks stay on an isolated hosted runner.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/sisyphus
    env:
      # Electron's test node binds loopback ports just like the Go integration suite.
      SISYPHUS_CI_LOCAL_NETWORK_LOCK: /tmp/sisyphus-ci-local-network.lock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      # The self-hosted runner already provides the pinned Node 24 toolchain.
      # Keep setup-node (and its download/cache traffic) on GitHub-hosted runners.
      - uses: actions/setup-node@v7
        if: runner.environment == 'github-hosted'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sisyphus/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build matching daemon for desktop lifecycle acceptance
        working-directory: .
        run: go build -o bin/sisyphusd ./apps/sisyphusd
      - name: Test desktop daemon lifecycle
        run: flock "$SISYPHUS_CI_LOCAL_NETWORK_LOCK" npm run test:daemon
      - run: npm run build
      # The real app, built above, driven in a window nobody sees against
      # the daemon built above, on a node and a profile of the tests' own.
      - name: End-to-end tests of the desktop app
        run: flock "$SISYPHUS_CI_LOCAL_NETWORK_LOCK" npm run test:e2e
