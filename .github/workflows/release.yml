name: Release

# Pushing a tag such as v0.1.0 builds sisyphusd for every supported platform,
# packages the desktop app on Linux, Windows and macOS, and publishes all of
# it as a GitHub release. A pull request that changes the release machinery
# runs the same builds without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-release.sh

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: ./scripts/build-release.sh "${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: sisyphusd
          path: dist/

  # The desktop app, with the node inside and the logo on it: an installer
  # for Windows, a disk image for macOS, an AppImage for Linux, and a plain
  # archive of each. Each is built on its own system. They are not signed
  # by a publisher; docs/user-guide.md says what a person sees because of it.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Every system and processor the app ships for, each built on its
        # own: Linux, Windows and macOS, on x64 and on arm64.
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-2025, windows-11-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/sisyphus
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sisyphus/package-lock.json
      - run: npm ci
      - name: Package
        shell: bash
        # macOS's hdiutil sometimes cannot detach the disk image it just
        # built ("Resource busy"), which fails the build after everything
        # has worked. That one failure is tried again, once; any other is not.
        run: |
          if ! npm run package:dist 2>&1 | tee package.log; then
            if [ "$RUNNER_OS" = macOS ] && grep -q "Unable to detach device cleanly" package.log; then
              echo "::warning::hdiutil could not detach the disk image; packaging again"
              npm run package:dist
            else
              exit 1
            fi
          fi
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/sisyphus/dist/*.zip
            apps/sisyphus/dist/*.tar.gz
            apps/sisyphus/dist/*.AppImage
            apps/sisyphus/dist/*-setup.exe
            apps/sisyphus/dist/*.dmg
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [daemon, desktop]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # One list of checksums for everything published.
      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
