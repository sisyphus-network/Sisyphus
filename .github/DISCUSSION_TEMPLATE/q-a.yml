body:
  - type: markdown
    attributes:
      value: |
        Questions about running a node, joining or running a pool, the desktop app, or how something in Sisyphus works. If you think you have found a bug, open an issue instead; if it is a security problem, report it privately (see SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you want to know, or what you are trying to do.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Commands you ran, what you expected and what happened. Paste output as text, and leave out api.token, invitations and keys.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `sisyphusd version`, or the commit you built from.
  - type: dropdown
    id: role
    attributes:
      label: The node's role
      options:
        - Coordinator
        - Worker
        - Worker and client
        - Client
        - Not running a node yet
